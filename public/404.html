<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ERROREN AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function() {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        var isGithubIo = window.location.hostname.indexOf('github.io') !== -1;
        var targetPath = '/';
        if (isGithubIo && parts.length > 0) {
          targetPath = '/' + parts[0] + '/';
        }
        window.location.replace(window.location.origin + targetPath);
      })();
    </script>
  </head>
  <body style="margin:0;padding:0;background:#070d1a;color:#00d2ff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
    <div style="text-align:center;font-size:14px;letter-spacing:0.05em;">
      Loading ERROREN AI...
    </div>
  </body>
</html>
