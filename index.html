<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERROREN - AI Assistant</title>
    <meta name="description" content="A fast and powerful AI assistant inspired by ChatGPT, featuring conversational memory, multi-modal analysis, and code synthesis." />
    <meta property="og:title" content="ERROREN - AI Assistant" />
    <meta property="og:description" content="A fast and powerful AI assistant inspired by ChatGPT, featuring conversational memory, multi-modal analysis, and code synthesis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="shortcut icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script>
      // Ensure GitHub Pages has a trailing slash for relative assets (prevents blank/loading screen)
      (function() {
        if (
          window.location.hostname.endsWith('github.io') &&
          !window.location.pathname.endsWith('/') &&
          !window.location.pathname.split('/').pop().includes('.')
        ) {
          window.location.replace(
            window.location.origin + window.location.pathname + '/' + window.location.search + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #070d1a; color: #f0f6fc; font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; background-color: #070d1a; color: #00d2ff;">
        <div style="width: 32px; height: 32px; border: 3px solid rgba(0, 210, 255, 0.2); border-top-color: #00d2ff; border-radius: 50%; animation: erroren-spin 0.8s linear infinite;"></div>
        <div style="font-family: monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #9bb0d1;">Loading ERROREN AI...</div>
      </div>
      <style>
        @keyframes erroren-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
